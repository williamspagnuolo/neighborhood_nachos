TRANSIT_BUCKET: "511_transit_data"
TRANSIT_OUTPUT_BUCKET: "511_transit_data"
TRANSIT_AGENCY: "muni"
# Empty means yesterday UTC. Workflows overrides this for scheduled/manual runs.
TRANSIT_SOURCE_DATE: ""

TRANSIT_TRIPUPDATES_RAW_PREFIX: "raw/TripUpdates"
TRANSIT_TRIPUPDATES_PARQUET_PREFIX: "latest/TripUpdates"
TRANSIT_TRIPUPDATES_OUTPUT_DIR: "/tmp/tripupdates_raw"
TRANSIT_TRIPUPDATES_CHUNK_SIZE: "250000"
TRANSIT_TRIPUPDATES_OUTPUT_SHARDS: "16"
TRANSIT_TRIPUPDATES_LATEST_ONLY: "true"
TRANSIT_WRITE_PARQUET_TO_GCS: "true"
TRANSIT_USE_SOURCE_DATE_FOLDER: "true"
TRANSIT_PARALLEL_FINALIZE_TIMEOUT_SECONDS: "3600"
