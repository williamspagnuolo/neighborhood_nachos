TRANSIT_BUCKET: "511_transit_data"
TRANSIT_OUTPUT_BUCKET: "511_transit_data"
TRANSIT_AGENCY: "muni"
# Empty means yesterday UTC. Workflows overrides this for scheduled/manual runs.
TRANSIT_SOURCE_DATE: ""

TRANSIT_VEHICLEPOSITIONS_RAW_PREFIX: "raw/VehiclePositions"
TRANSIT_VEHICLEPOSITIONS_PARQUET_PREFIX: "latest/VehiclePositions"
TRANSIT_VEHICLEPOSITIONS_OUTPUT_DIR: "/tmp/vehiclepositions_latest"
TRANSIT_VEHICLEPOSITIONS_OUTPUT_SHARDS: "16"
TRANSIT_USE_SOURCE_DATE_FOLDER: "true"
TRANSIT_PARALLEL_FINALIZE_TIMEOUT_SECONDS: "3600"
